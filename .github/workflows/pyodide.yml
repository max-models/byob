name: Pyodide

# The check that byob runs in the browser, as the live demo of the docs does: its wheel and those
# of its devel dependencies installed in Pyodide, every module imported and the demo
# (docs/src/components/byob_demo.py) run with its defaults; the shared workflow of
# max-models/starlight-theme.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

jobs:
  pyodide:
    uses: max-models/starlight-theme/.github/workflows/pyodide.yml@v0
